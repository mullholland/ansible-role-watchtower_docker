---
# EXPERIMENTAL: this workflow deviates from the shared ansible-generator
# template. It runs molecule directly on the GitHub-hosted runner (pinned
# versions from molecule/requirements.txt) instead of via
# robertdebock/molecule-action@6.0.1, whose bundled ansible-core/collections
# are too old for several current distro releases (dnf5 on Fedora, GnuPG 2.4
# on EL10, requests>=2.32 with community.docker). See
# https://github.com/mother-of-all-self-hosting/ansible-role-healthchecks/blob/main/.github/workflows/molecule.yml
# for the pattern this is based on.

name: Molecule

on:
  push:
    tags_ignore:
      - '*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 22 23 * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ansible-lint
        uses: ansible/ansible-lint@main
  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # "redhat" (mullholland/docker-redhat-systemd, built on UBI) is
          # intentionally not tested: UBI10's redistributable repos don't
          # carry iptables-nft/iptables, which docker-ce requires - a gap
          # specific to UBI, not real RHEL. Rocky/AlmaLinux/CentOS Stream
          # below provide working EL9/EL10 coverage instead.
          - image: "rockylinux"
            tag: "8"
          - image: "rockylinux"
            tag: "9"
          - image: "rockylinux"
            tag: "10"
          - image: "almalinux"
            tag: "8"
          - image: "almalinux"
            tag: "9"
          - image: "almalinux"
            tag: "10"
          - image: "ubuntu"
            tag: "resolute"
          - image: "ubuntu"
            tag: "noble"
          - image: "ubuntu"
            tag: "jammy"
          - image: "debian"
            tag: "trixie"
          - image: "centos"
            tag: "9"
          - image: "centos"
            tag: "10"
    env:
      namespace: mullholland
      image: ${{ matrix.config.image }}
      tag: ${{ matrix.config.tag }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install Python dependencies
        run: pip install -r molecule/requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.docker ansible.posix

      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-community-docker-ansible-posix

      - name: Run Molecule
        run: molecule test
