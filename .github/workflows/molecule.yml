---
#
# Ansible managed
#

name: Molecule

on:
  push:
    tags_ignore:
      - '*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 22 23 * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ansible-lint
        uses: ansible/ansible-lint@main
  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - image: "fedora"
            tag: "42"
          - image: "fedora"
            tag: "43"
          - image: "rockylinux"
            tag: "8"
          - image: "rockylinux"
            tag: "9"
          - image: "rockylinux"
            tag: "10"
          - image: "almalinux"
            tag: "8"
          - image: "almalinux"
            tag: "9"
          - image: "almalinux"
            tag: "10"
          - image: "ubuntu"
            tag: "resolute"
          - image: "ubuntu"
            tag: "noble"
          - image: "ubuntu"
            tag: "jammy"
          - image: "debian"
            tag: "trixie"
          - image: "centos"
            tag: "9"
          - image: "centos"
            tag: "10"
    env:
      namespace: mullholland
      image: ${{ matrix.config.image }}
      tag: ${{ matrix.config.tag }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install Python dependencies
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Run Molecule
        run: molecule test
