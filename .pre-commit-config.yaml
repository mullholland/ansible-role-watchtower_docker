---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -c=.yamllint

  - repo: https://github.com/robertdebock/pre-commit
    rev: v1.5.2  # v1.5.3 breaks ansible_role_find_unused_variable: grep_folder="*" is quoted in the grep call, so it looks for a literal file named "*" instead of expanding, and every variable is falsely reported as unused
    hooks:
      - id: ansible_role_find_unused_variable
      - id: ansible_role_find_empty_files
      - id: ansible_role_find_empty_directories
      - id: ansible_role_find_undefined_handlers
      - id: ansible_role_find_unquoted_values
      - id: ansible_role_find_horizontal_when

  - repo: https://github.com/ansible-community/ansible-lint.git
    rev: v26.8.0  # put latest release tag from https://github.com/ansible-community/ansible-lint/releases/
    hooks:
      - id: ansible-lint
        files: \.(yaml|yml)$
        verbose: true
        args: ["-p", "./"]
